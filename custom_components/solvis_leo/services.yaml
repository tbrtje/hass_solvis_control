scan_modbus_range:
  name: Scan Modbus range
  description: Read input and/or holding registers from the configured SC3 and return raw values and possible interpretations.
  fields:
    config_entry_id:
      name: Config entry
      description: Optional when exactly one SolvisLeo 180 entry is loaded.
      selector:
        config_entry:
          integration: solvis_leo
    start_address:
      name: Start address
      description: First address to read, inclusive (zero-based Modbus address).
      required: true
      example: 33024
      selector:
        number:
          min: 0
          max: 65535
          step: 1
          mode: box
    end_address:
      name: End address
      description: Last address to read, inclusive.
      required: true
      example: 33041
      selector:
        number:
          min: 0
          max: 65535
          step: 1
          mode: box
    register_type:
      name: Register type
      default: both
      selector:
        select:
          options:
            - input
            - holding
            - both
    slave_id:
      name: Modbus device ID
      default: 1
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
    batch_size:
      name: Batch size
      description: Registers per request. Failed batches fall back to individual reads.
      default: 20
      selector:
        number:
          min: 1
          max: 125
          step: 1
          mode: box
    delay:
      name: Delay
      description: Pause in seconds after each request, including rejected batches.
      default: 0.05
      selector:
        number:
          min: 0
          max: 5
          step: 0.01
          mode: box
